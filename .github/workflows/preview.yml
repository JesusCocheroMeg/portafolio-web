# En cada Pull Request publica una vista previa temporal (7 días) y deja el enlace como comentario.
name: Vista previa del PR

on: pull_request

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    # Solo PRs del mismo repo: los forks no tienen acceso al secreto.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Variable del repo (Settings → Secrets and variables → Actions → Variables). "false" las apaga.
          NEXT_PUBLIC_SHOW_PROJECT_IMAGES: ${{ vars.SHOW_PROJECT_IMAGES }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESUSCOCHERO }}
          projectId: jesuscochero
          expires: 7d

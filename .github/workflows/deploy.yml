# Publica el sitio en Firebase Hosting (https://jesuscochero.web.app) en cada push a main.
name: Publicar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JESUSCOCHERO }}
          projectId: jesuscochero
          channelId: live
